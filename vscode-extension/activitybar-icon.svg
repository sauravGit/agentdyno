<!-- VS Code renders activity-bar icons as a CSS mask (fills become the theme's
     icon color automatically) — so plain solid black shapes are the correct,
     portable choice here, not brand colors or currentColor. -->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round">
  <circle cx="12" cy="12" r="8.2"/>
  <path d="M 12 3.8 A 8.2 8.2 0 1 1 5.4 16.3" stroke-width="2.4"/>
  <line x1="12" y1="12" x2="12" y2="6.2"/>
  <circle cx="12" cy="12" r="1.3" fill="#000" stroke="none"/>
</svg>
