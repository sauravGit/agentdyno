name: Documentation sync loop

# Saved project loop (LOOPS.md: "Documentation sync loop"). Fires on every
# PR touching src/** or package.json, audits every doc against real current
# behavior, fixes only what's stale directly on the PR's own branch, verifies
# with npm test, and comments — never touches source code itself. Also
# runnable manually via workflow_dispatch. Requires an ANTHROPIC_API_KEY
# secret scoped to the "main" GitHub Environment.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  doc-sync:
    runs-on: ubuntu-latest
    # ANTHROPIC_API_KEY is scoped to the "main" GitHub Environment, not a
    # plain repo secret — a job must declare its environment to see it.
    environment: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: ${{ github.head_ref || github.ref_name }}

            Review the whole codebase against README.md, ONBOARDING.md,
            BUILD_LOG.md, site/*.html, and recap.html. For each doc claim
            (commands, versions, file paths, output examples), check it
            against real current behavior — read the actual source, run
            commands where possible.

            Fix stale docs only. Never edit source code (src/**,
            vscode-extension/src/**, test/**) — this loop is documentation
            only. After each fix, re-check it against real behavior and run
            `npm test` to confirm nothing else broke. Repeat until no more
            stale doc items are found.

            You are running on this PR's own branch. If you find no stale
            documentation, make no changes and say so in a PR comment. If
            you find and fix stale docs, commit the fixes directly to this
            branch and leave a PR comment describing exactly what was stale
            and what changed.
          claude_args: |
            --max-turns 60
            --allowedTools Read,Edit,Write,Grep,Glob,"Bash(npm test)","Bash(npm run build)","Bash(node dist/src/cli.js *)","Bash(git add *)","Bash(git commit *)","Bash(git push*)","Bash(git status*)","Bash(git diff*)"
