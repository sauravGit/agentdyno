name: Documentation sync loop

# Saved project loop (LOOPS.md: "Documentation sync loop"). Fires on every
# PR touching src/** or package.json, checks a bounded set of doc claims
# against real current behavior, fixes only what's stale, verifies with
# npm test, and comments — never touches source code itself. Also runnable
# manually via workflow_dispatch. Requires a CLAUDE_CODE_OAUTH_TOKEN secret
# scoped to the "main" GitHub Environment.
#
# Design note (found by actually running this twice, ~$6 combined, both
# hitting max-turns with the same unexplained permission-denial count):
# the agent is NOT responsible for git operations. Asking it to also figure
# out git identity/add/commit/push added unbounded trial-and-error on top
# of an already open-ended "review everything" task. Committing is now a
# separate, deterministic shell step — the agent's only job is to edit
# files, which it has clear tools for.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  doc-sync:
    runs-on: ubuntu-latest
    # CLAUDE_CODE_OAUTH_TOKEN is scoped to the "main" GitHub Environment, not a
    # plain repo secret — a job must declare its environment to see it.
    environment: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: ${{ github.head_ref || github.ref_name }}

            Check these specific, bounded claims in README.md, ONBOARDING.md,
            BUILD_LOG.md, site/index.html, and recap.html against the real
            current implementation. Do not go beyond this list:

            1. The version number(s) mentioned match package.json's version.
            2. Every `dyno <command>` mentioned actually appears in src/cli.ts's
               HELP text (grep for it).
            3. Every file path mentioned (e.g. vscode-extension/*, site/*)
               actually exists.
            4. The vscode-extension version mentioned matches
               vscode-extension/package.json's version.
            5. Any literal captured command output block whose command you can
               safely run read-only (e.g. `dyno --version`, `dyno scan`) still
               matches — only if a real local dyno build already exists at
               dist/src/cli.js; skip this check otherwise rather than trying
               to build or install anything.

            Fix only what's genuinely stale from this list. Never edit source
            code (src/**, vscode-extension/src/**, test/**) — this loop is
            documentation only. If you edit a file, run `npm test` once at
            the end to confirm nothing else broke (it should not touch
            source, so this should always still pass).

            Do not run git commands — committing is handled separately. Just
            leave the working tree with your file edits (or no edits, if
            everything checked out). End by stating plainly whether you
            found anything stale, and if so, exactly what you changed.
          claude_args: |
            --max-turns 25
            --allowedTools Read,Edit,Write,Grep,Glob,"Bash(npm test)","Bash(node dist/src/cli.js *)"

      - name: Commit and push any doc fixes
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- README.md ONBOARDING.md BUILD_LOG.md site recap.html 2>/dev/null)" ]; then
            git config user.name "claude[bot]"
            git config user.email "claude[bot]@users.noreply.github.com"
            git add README.md ONBOARDING.md BUILD_LOG.md site recap.html
            git commit -m "docs: sync stale documentation (automated doc-sync loop)"
            git push origin HEAD:"${{ github.head_ref || github.ref_name }}"
            echo "Pushed doc fixes."
          else
            echo "No doc changes to commit."
          fi
